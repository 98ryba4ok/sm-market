services:
  django:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: sm_market_django
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: sm_market_db_prod
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    container_name: sm_market_nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - media_data:/app/media
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - django
    restart: always

volumes:
  postgres_data_prod:
  media_data:
  certbot_conf:
  certbot_www:
